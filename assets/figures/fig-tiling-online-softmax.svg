<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="780" height="470" fill="#ffffff"/>
  <text x="24" y="32" font-size="19" font-weight="700" fill="#111827">分块 + 在线 softmax：注意力矩阵从不落 HBM</text>
  <text x="24" y="54" font-size="13" fill="#6b7280">外循环遍历 Q 的行分块，内循环遍历 K、V 的分块，统计量 (m, ℓ) 沿途增量更新</text>

  <!-- Q on left -->
  <text x="60" y="100" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">Q</text>
  <rect x="24" y="110" width="72" height="200" fill="#dbeafe" stroke="#2563eb"/>
  <line x1="24" y1="160" x2="96" y2="160" stroke="#2563eb"/>
  <line x1="24" y1="210" x2="96" y2="210" stroke="#2563eb"/>
  <line x1="24" y1="260" x2="96" y2="260" stroke="#2563eb"/>
  <rect x="24" y="110" width="72" height="50" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="141" font-size="12" fill="#1e3a8a" text-anchor="middle">Q_i</text>
  <text x="60" y="336" font-size="11" fill="#6b7280" text-anchor="middle">N × d</text>

  <!-- arrow -->
  <path d="M104 135 L 210 135" stroke="#9ca3af" stroke-width="2" marker-end="url(#a2)"/>
  <defs><marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9ca3af"/></marker></defs>

  <!-- S matrix -->
  <text x="330" y="100" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">S = Q Kᵀ　（N × N）</text>
  <rect x="210" y="110" width="240" height="200" fill="#f9fafb" stroke="#9ca3af"/>
  <line x1="270" y1="110" x2="270" y2="310" stroke="#d1d5db"/>
  <line x1="330" y1="110" x2="330" y2="310" stroke="#d1d5db"/>
  <line x1="390" y1="110" x2="390" y2="310" stroke="#d1d5db"/>
  <line x1="210" y1="160" x2="450" y2="160" stroke="#d1d5db"/>
  <line x1="210" y1="210" x2="450" y2="210" stroke="#d1d5db"/>
  <line x1="210" y1="260" x2="450" y2="260" stroke="#d1d5db"/>
  <!-- highlighted row band -->
  <rect x="210" y="110" width="240" height="50" fill="#bfdbfe" opacity="0.75"/>
  <rect x="210" y="110" width="60" height="50" fill="#2563eb" opacity="0.85"/>
  <rect x="270" y="110" width="60" height="50" fill="#f97316" opacity="0.85"/>
  <!-- masked upper triangle hint -->
  <path d="M210 110 L 450 110 L 450 310 Z" fill="#6b7280" opacity="0.07"/>
  <text x="330" y="336" font-size="11" fill="#6b7280" text-anchor="middle">按行归约 softmax → 沿列方向分块</text>

  <!-- arrow right -->
  <path d="M458 135 L 556 135" stroke="#9ca3af" stroke-width="2" marker-end="url(#a2)"/>

  <!-- statistics -->
  <rect x="556" y="110" width="200" height="200" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="656" y="136" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">片上只留统计量</text>
  <text x="572" y="166" font-size="12.5" fill="#78350f">m  ∈ R^N　逐行最大值</text>
  <text x="572" y="190" font-size="12.5" fill="#78350f">ℓ  ∈ R^N　指数和</text>
  <text x="572" y="214" font-size="12.5" fill="#78350f">O  ∈ R^{N×d}　输出累加器</text>
  <line x1="572" y1="228" x2="740" y2="228" stroke="#fcd34d"/>
  <text x="572" y="250" font-size="12" fill="#78350f">更新规则：</text>
  <text x="572" y="270" font-size="11" fill="#78350f">m ← max(m, rowmax(S_ij))</text>
  <text x="572" y="290" font-size="11" fill="#78350f">ℓ ← e^(m−m_new)·ℓ</text>
  <text x="572" y="306" font-size="11" fill="#78350f">　　+ e^(m̃−m_new)·ℓ̃</text>

  <!-- bottom: K V blocks -->
  <text x="24" y="378" font-size="14" font-weight="700" fill="#166534">K, V （N × d）切成 T_c 块，逐个送进 SRAM</text>
  <rect x="24" y="392" width="90" height="46" fill="#dcfce7" stroke="#16a34a"/>
  <text x="69" y="420" font-size="12" fill="#14532d" text-anchor="middle">K_j, V_j</text>
  <rect x="126" y="392" width="90" height="46" fill="#dcfce7" stroke="#16a34a"/>
  <text x="171" y="420" font-size="12" fill="#14532d" text-anchor="middle">K_j+1, V_j+1</text>
  <text x="228" y="420" font-size="14" fill="#16a34a">···</text>
  <text x="300" y="412" font-size="12.5" fill="#374151">每块算完立即累加进 O，并把旧的 O、ℓ 按新的 m 重缩放</text>
  <text x="300" y="432" font-size="12.5" fill="#374151">全部块处理完后才做最后一次归一化（FA2 把这一步推迟到循环外）</text>
</svg>
