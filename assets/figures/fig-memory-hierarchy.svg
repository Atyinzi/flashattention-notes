<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="760" height="430" fill="#ffffff"/>
  <text x="24" y="34" font-size="19" font-weight="700" fill="#111827">GPU 存储层级与 FlashAttention 的取舍</text>
  <text x="24" y="57" font-size="13" fill="#6b7280">容量大的慢、容量小的快 —— 优化的关键是把数据留在片上反复使用</text>

  <!-- SRAM -->
  <rect x="180" y="80" width="400" height="82" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="110" font-size="16" font-weight="700" fill="#14532d" text-anchor="middle">SRAM　片上共享内存</text>
  <text x="380" y="132" font-size="13" fill="#166534" text-anchor="middle">192 KB / SM　×　108 SM（A100）</text>
  <text x="380" y="151" font-size="13" fill="#166534" text-anchor="middle">≈ 19 TB/s</text>
  <text x="170" y="126" font-size="12" fill="#16a34a" text-anchor="end" font-weight="700">快 ↑</text>

  <!-- HBM -->
  <rect x="110" y="186" width="540" height="82" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="216" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">HBM　高带宽显存</text>
  <text x="380" y="238" font-size="13" fill="#1e40af" text-anchor="middle">40–80 GB（A100）</text>
  <text x="380" y="257" font-size="13" fill="#1e40af" text-anchor="middle">1.5–2.0 TB/s</text>

  <!-- DRAM -->
  <rect x="40" y="292" width="680" height="76" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="380" y="320" font-size="16" font-weight="700" fill="#374151" text-anchor="middle">CPU DRAM　主机内存</text>
  <text x="380" y="342" font-size="13" fill="#4b5563" text-anchor="middle">&gt; 1 TB　·　≈ 12.8 GB/s</text>

  <!-- moving cost arrow -->
  <line x1="660" y1="121" x2="660" y2="227" stroke="#ef4444" stroke-width="2.5" marker-end="url(#ar)" marker-start="url(#ar2)"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ef4444"/></marker>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="2" refY="4.5" orient="auto"><path d="M9,0 L0,4.5 L9,9 z" fill="#ef4444"/></marker>
  </defs>
  <text x="672" y="168" font-size="13" font-weight="700" fill="#ef4444">数据</text>
  <text x="672" y="185" font-size="13" font-weight="700" fill="#ef4444">搬运</text>
  <text x="672" y="202" font-size="13" font-weight="700" fill="#ef4444">= IO</text>
  <text x="672" y="221" font-size="11.5" fill="#ef4444">要尽量少</text>

  <!-- takeaway -->
  <rect x="40" y="384" width="680" height="34" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="406" font-size="13" fill="#78350f" text-anchor="middle">
    N×N 的注意力矩阵装不进 SRAM，标准实现只能把它写进 HBM 再读回来 —— 这就是要消除的往返
  </text>
</svg>
