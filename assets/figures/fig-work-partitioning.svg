<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="800" height="440" fill="#ffffff"/>
  <text x="24" y="32" font-size="19" font-weight="700" fill="#111827">Work Partitioning：切哪个矩阵，决定了要不要同步</text>
  <text x="24" y="54" font-size="13" fill="#6b7280">同一个 thread block 内的 4 个 warp 如何分工 —— FA-2 把"部分和 + 归约"换成了"独立片段 + 拼接"</text>

  <!-- ===== v1 ===== -->
  <text x="40" y="94" font-size="15" font-weight="700" fill="#b91c1c">FlashAttention v1　切 K、V</text>
  <rect x="40" y="108" width="300" height="250" rx="10" fill="#fef2f2" stroke="#fca5a5"/>

  <!-- Q unsplit -->
  <text x="60" y="134" font-size="12" fill="#374151">Q　不切分</text>
  <rect x="60" y="144" width="60" height="120" fill="#dbeafe" stroke="#2563eb"/>
  <text x="90" y="210" font-size="11" fill="#1e3a8a" text-anchor="middle">Q</text>

  <text x="132" y="200" font-size="16" fill="#6b7280">×</text>

  <!-- K V split into 4 -->
  <text x="158" y="128" font-size="11.5" fill="#374151">K, V 切成 4 块</text>
  <rect x="160" y="144" width="42" height="28" fill="#dcfce7" stroke="#16a34a"/><text x="181" y="163" font-size="10" text-anchor="middle" fill="#14532d">K₁V₁</text>
  <rect x="160" y="176" width="42" height="28" fill="#dcfce7" stroke="#16a34a"/><text x="181" y="195" font-size="10" text-anchor="middle" fill="#14532d">K₂V₂</text>
  <rect x="160" y="208" width="42" height="28" fill="#dcfce7" stroke="#16a34a"/><text x="181" y="227" font-size="10" text-anchor="middle" fill="#14532d">K₃V₃</text>
  <rect x="160" y="240" width="42" height="28" fill="#dcfce7" stroke="#16a34a"/><text x="181" y="259" font-size="10" text-anchor="middle" fill="#14532d">K₄V₄</text>

  <text x="218" y="200" font-size="16" fill="#6b7280">→</text>

  <!-- partial outputs N x d each -->
  <text x="244" y="128" font-size="11.5" fill="#374151">4 个部分输出</text>
  <rect x="240" y="144" width="80" height="26" fill="#fde68a" stroke="#d97706"/><text x="280" y="161" font-size="10.5" text-anchor="middle" fill="#78350f">O₁ ∈ R^{N×d}</text>
  <rect x="240" y="174" width="80" height="26" fill="#fde68a" stroke="#d97706"/><text x="280" y="191" font-size="10.5" text-anchor="middle" fill="#78350f">O₂ ∈ R^{N×d}</text>
  <rect x="240" y="204" width="80" height="26" fill="#fde68a" stroke="#d97706"/><text x="280" y="221" font-size="10.5" text-anchor="middle" fill="#78350f">O₃ ∈ R^{N×d}</text>
  <rect x="240" y="234" width="80" height="26" fill="#fde68a" stroke="#d97706"/><text x="280" y="251" font-size="10.5" text-anchor="middle" fill="#78350f">O₄ ∈ R^{N×d}</text>

  <rect x="60" y="288" width="260" height="58" rx="6" fill="#fee2e2" stroke="#ef4444"/>
  <text x="190" y="308" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">尺寸与最终输出相同 → 只是部分和</text>
  <text x="190" y="328" font-size="11.5" fill="#7f1d1d" text-anchor="middle">必须同步 + 相加 O₁+O₂+O₃+O₄</text>
  <text x="190" y="341" font-size="11" fill="#991b1b" text-anchor="middle">代价：shared memory 读写、同步、额外加法</text>

  <!-- ===== v2 ===== -->
  <text x="420" y="94" font-size="15" font-weight="700" fill="#15803d">FlashAttention-2　切 Q</text>
  <rect x="420" y="108" width="340" height="250" rx="10" fill="#f0fdf4" stroke="#86efac"/>

  <text x="440" y="134" font-size="12" fill="#374151">Q 按行切成 4 块</text>
  <rect x="440" y="144" width="44" height="26" fill="#bfdbfe" stroke="#2563eb"/><text x="462" y="161" font-size="10.5" text-anchor="middle" fill="#1e3a8a">Q₁</text>
  <rect x="440" y="174" width="44" height="26" fill="#bfdbfe" stroke="#2563eb"/><text x="462" y="191" font-size="10.5" text-anchor="middle" fill="#1e3a8a">Q₂</text>
  <rect x="440" y="204" width="44" height="26" fill="#bfdbfe" stroke="#2563eb"/><text x="462" y="221" font-size="10.5" text-anchor="middle" fill="#1e3a8a">Q₃</text>
  <rect x="440" y="234" width="44" height="26" fill="#bfdbfe" stroke="#2563eb"/><text x="462" y="251" font-size="10.5" text-anchor="middle" fill="#1e3a8a">Q₄</text>

  <text x="492" y="200" font-size="16" fill="#6b7280">×</text>

  <text x="512" y="122" font-size="11.5" fill="#374151">K, V 不切</text>
  <rect x="512" y="132" width="56" height="128" fill="#dcfce7" stroke="#16a34a"/>
  <text x="540" y="200" font-size="11" text-anchor="middle" fill="#14532d">K, V</text>

  <text x="576" y="200" font-size="16" fill="#6b7280">→</text>

  <rect x="596" y="132" width="104" height="128" fill="#f0fdf4" stroke="#86efac" stroke-dasharray="3,3"/>
  <rect x="640" y="150" width="104" height="26" fill="#bbf7d0" stroke="#16a34a"/><text x="692" y="167" font-size="10.5" text-anchor="middle" fill="#14532d">O₁ ∈ R^{(N/4)×d}</text>
  <rect x="640" y="180" width="104" height="26" fill="#bbf7d0" stroke="#16a34a"/><text x="692" y="197" font-size="10.5" text-anchor="middle" fill="#14532d">O₂ ∈ R^{(N/4)×d}</text>
  <rect x="640" y="210" width="104" height="26" fill="#bbf7d0" stroke="#16a34a"/><text x="692" y="227" font-size="10.5" text-anchor="middle" fill="#14532d">O₃ ∈ R^{(N/4)×d}</text>
  <rect x="640" y="240" width="104" height="26" fill="#bbf7d0" stroke="#16a34a"/><text x="692" y="257" font-size="10.5" text-anchor="middle" fill="#14532d">O₄ ∈ R^{(N/4)×d}</text>
  <text x="600" y="284" font-size="11.5" fill="#374151">4 个行带片段</text>

  <rect x="440" y="288" width="300" height="58" rx="6" fill="#dcfce7" stroke="#22c55e"/>
  <text x="590" y="308" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">各是输出的一行带 → 互不重叠</text>
  <text x="590" y="328" font-size="11.5" fill="#14532d" text-anchor="middle">直接拼接即可，warp 之间无需通信</text>
  <text x="590" y="341" font-size="11" fill="#166534" text-anchor="middle">省掉同步、额外加法及其读写</text>
</svg>
